[package]
name = "beakid"
version = "0.4.0"
edition = "2021"
description = "Snowflake-like 64-bit unique ID generator with PostgreSQL BIGINT-friendly i64 IDs."
rust-version = "1.75.0"
license = "MIT"
readme = "README.md"
keywords = ["id", "snowflake", "unique", "bigint", "postgres"]
categories = ["data-structures", "database"]
repository = "https://github.com/toki-team/beakid-rs"
homepage = "https://github.com/toki-team/beakid-rs"
include = ["src/**/*.rs", "README.md", "README.ru.md", "LICENSE"]

[dependencies]
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
] }
